<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Outdoors</title>

    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/maplibre-contour@latest/dist/index.min.js"></script>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
      }
      #map {
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      // 🙇 https://registry.opendata.aws/terrain-tiles/
      // const TERRARIUM_URL = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";

      // 🙇 https://github.com/mapterhorn/mapterhorn
      const TERRARIUM_URL = "https://tiles.mapterhorn.com/{z}/{x}/{y}.webp";

      const terrainSource = {
        type: "raster-dem",
        tiles: [TERRARIUM_URL],
        encoding: "terrarium",
        tileSize: 512,
        maxzoom: 15,
      };

      // Fetch the base style so we can modify it before passing to MapLibre
      const styleUrl = "https://tiles.openfreemap.org/styles/liberty";

      // ── Contour setup (runtime: registers mlcontour:// protocol) ──
      // 🙇 https://github.com/onthegomap/maplibre-contour
      const demSource = new mlcontour.DemSource({
        url: TERRARIUM_URL,
        encoding: "terrarium",
        maxzoom: 13,
        worker: true,
      });
      demSource.setupMaplibre(maplibregl);

      const contourTileUrl = demSource.contourProtocolUrl({
        thresholds: {
          0: [100, 500],
          5: [50, 250],
          10: [25, 100],
          15: [25, 100],
        },
        contourLayer: "contours",
        elevationKey: "ele",
        levelKey: "level",
        extent: 4096,
        buffer: 1,
      });

      fetch(styleUrl)
        .then((r) => r.json())
        .then((style) => {
          // ── Modify style here if needed ──

          // Terrain source & hillshade
          style.sources["terrainSource"] = terrainSource;
          style.terrain = { source: "terrainSource", exaggeration: 1.5 };
          style.layers.push({
            id: "hillshade-layer",
            type: "hillshade",
            source: "terrainSource",
            paint: { "hillshade-exaggeration": 0.2 },
          });

          // Contour source & layers
          style.sources["contour-source"] = {
            type: "vector",
            minzoom: 10,
            tiles: [contourTileUrl],
            maxzoom: 15,
          };
          style.layers.push(
            {
              id: "contour-lines",
              type: "line",
              source: "contour-source",
              "source-layer": "contours",
              minzoom: 10,
              filter: ["==", ["get", "level"], 0],
              paint: {
                "line-color": "rgb(126, 124, 121)",
                "line-opacity": 0.25,
                "line-width": 0.5,
              },
            },
            {
              id: "contour-lines-index",
              type: "line",
              source: "contour-source",
              "source-layer": "contours",
              minzoom: 10,
              filter: [">", ["get", "level"], 0],
              paint: {
                "line-color": "rgb(124, 122, 121)",
                "line-opacity": 0.1,
                "line-width": 1.0,
              },
            },
            {
              id: "contour-labels",
              type: "symbol",
              source: "contour-source",
              "source-layer": "contours",
              minzoom: 11,
              filter: [">", ["get", "level"], 0],
              layout: {
                "symbol-placement": "line",
                "symbol-avoid-edges": true,
                "text-rotation-alignment": "map",
                "text-size": [
                  "interpolate",
                  ["linear"],
                  ["zoom"],
                  11,
                  6,
                  18,
                  10,
                ],
                "text-field": [
                  "concat",
                  ["number-format", ["get", "ele"], {}],
                  "m",
                ],
                "text-font": ["Noto Sans Regular"],
                "text-padding": 0,
              },
              paint: {
                "text-color": "#5c5c5c",
                "text-halo-color": "rgba(255, 255, 255, 0.85)",
                "text-halo-width": 1.25,
              },
            },
          );

          // MTB scale — insert before poi_r20 so it sits above roads but below POI labels
          // https://github.com/hyperknot/openfreemap/issues/31#issuecomment-4649028862
          // Not exhaustive, e.g. mtb:scale=imba is not included
          // https://wiki.openstreetmap.org/wiki/Key:mtb:scale:imba
          //
          // Activity layers use minzoom/maxzoom 0-22 so they render at every zoom
          // where the tag data exists in the tile — no artificial zoom gating.
          const mtbLayer = {
            id: "mtb_scale-casing",
            type: "line",
            metadata: { "mapbox:group": "1444849345966.4436" },
            source: "openmaptiles",
            "source-layer": "transportation",
            minzoom: 0,
            maxzoom: 22,
            filter: [
              "all",
              ["==", "$type", "LineString"],
              ["!=", "brunnel", "tunnel"],
              ["has", "mtb_scale"],
            ],
            layout: { "line-cap": "round", "line-join": "round" },
            paint: {
              "line-color": [
                "match",
                ["get", "mtb_scale"],
                "1",
                "blue",
                "2",
                "red",
                "black",
              ],
              "line-opacity": 0.8,
              "line-width": {
                base: 1.2,
                stops: [
                  [12, 0.5],
                  [16, 3],
                ],
              },
            },
          };
          const poiIdx = style.layers.findIndex((l) => l.id === "poi_r20");
          if (poiIdx !== -1) style.layers.splice(poiIdx, 0, mtbLayer);
          else style.layers.push(mtbLayer);

          // Bicycle access — insert before poi_r20
          // A single bold grey line for any trail tagged with bicycle=*
          // (designated, yes, permissive, etc.). Roads excluded — bicycle
          // tags are common on roads too, but this example spotlights trails.
          // Excludes path-class features (already styled by road_path_pedestrian)
          // so only tracks get the green overlay.
          // https://wiki.openstreetmap.org/wiki/Key:bicycle
          const bicycleLayer = {
            id: "bicycle-access",
            type: "line",
            source: "openmaptiles",
            "source-layer": "transportation",
            minzoom: 0,
            maxzoom: 22,
            filter: [
              "all",
              ["==", "$type", "LineString"],
              ["!=", "brunnel", "tunnel"],
              ["has", "bicycle"],
              ["in", "class", "track"],
            ],
            paint: {
              "line-color": "#6c6b6a",
              "line-opacity": 0.7,
              "line-width": 2,
            },
          };
          if (poiIdx !== -1) style.layers.splice(poiIdx, 0, bicycleLayer);
          else style.layers.push(bicycleLayer);

          // Path/track highlighting — modify existing layer
          // Philosophy: if the tile has trail data, display it. No zoom filtering,
          // no fade-in — loud and proud at all zoom levels.
          //
          // OpenMapTiles includes path data in tiles from z12 (route members),
          // z13 (named/routed/sac_scale), and z14+ (all paths).
          // Ref: https://github.com/openmaptiles/openmaptiles/pull/1190
          //      https://github.com/openmaptiles/openmaptiles/pull/1334
          const pathLayer = style.layers.find(
            (l) => l.id === "road_path_pedestrian",
          );
          if (pathLayer) {
            pathLayer.minzoom = 0;
            pathLayer.maxzoom = 22;
            pathLayer.paint = pathLayer.paint || {};
            pathLayer.paint["line-color"] = "#c05a2a";
            pathLayer.paint["line-opacity"] = [
              "case",
              ["has", "mtb_scale"],
              0,
              1,
            ];
            pathLayer.paint["line-width"] = [
              "interpolate",
              ["exponential", 1.2],
              ["zoom"],
              12,
              1,
              14,
              2,
              20,
              8,
            ];
          }

          // Note: tunnel/bridge path variants, poi, building extrusions etc.
          // are omitted — this is a minimal example, not exhaustive.

          // Path name labels — modify existing highway-name-path layer
          const nameLayer = style.layers.find(
            (l) => l.id === "highway-name-path",
          );
          if (nameLayer) {
            nameLayer.minzoom = 0;
            nameLayer.maxzoom = 22;
            nameLayer.paint = nameLayer.paint || {};
            nameLayer.paint["text-color"] = "#c05a2a";
          }

          const map = new maplibregl.Map({
            container: "map",
            style: style,

            // Cumberland mtb:scale:imba example... not supported
            //center: [-125.022417, 49.607406],

            // Pove del Grappa 45.821142,11.7373742
            center: [11.7373742, 45.824042],

            zoom: 12,
          });
        });
    </script>
  </body>
</html>
